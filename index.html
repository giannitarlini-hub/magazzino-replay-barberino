<!doctype html>
<html lang="it"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Magazzino Replay Barberino</title><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><style>
*{box-sizing:border-box}body{margin:0;background:#f3f6fb;color:#172338;font:16px Arial}header{background:#101d30;color:#fff;padding:22px}main{max-width:900px;margin:24px auto;padding:0 14px}.panel{background:white;border-radius:14px;padding:20px;margin:16px 0}h1{font-size:24px}label{display:block;font-weight:bold;margin:12px 0 6px}input,select,button{width:100%;padding:12px;border:1px solid #ccd4e0;border-radius:8px;font:inherit}button{background:#1769e8;color:white;border:0;font-weight:bold;cursor:pointer;margin-top:12px}.secondary{background:#eaf1ff;color:#164fa8}.danger{background:#b42318}.grid,.result{display:grid;grid-template-columns:1fr 1fr;gap:12px}.muted{color:#64748b;font-size:13px}.photo{width:100%;max-height:250px;object-fit:contain;background:#eef2f7}.row{padding:10px 0;border-bottom:1px solid #ddd;overflow-wrap:anywhere}#app{display:none}@media(max-width:600px){.grid,.result{grid-template-columns:1fr}}
</style></head><body><header><b>REPLAY</b><div>MAGAZZINO · BARBERINO OUTLET</div></header><main>
<section id="login" class="panel"><h1>Accesso riservato</h1><label>Email</label><input id="email" type="email"><label>Password</label><input id="password" type="password"><button onclick="signIn()">Accedi</button><p id="loginMessage" class="muted"></p></section>
<section id="app"><h1>Trova un capo in magazzino</h1><p class="muted">Cerca il codice modello e scopri dove si trova.</p><section class="panel"><label>Cerca codice modello</label><input id="searchCode" placeholder="Es. MOODR.004.M00L2L"><button onclick="searchProduct()">Cerca</button><p id="searchMessage" class="muted"></p></section>
<section id="productPanel" class="panel" style="display:none"><div class="result"><div><img id="garmentPhoto" class="photo" alt="Foto capo"><p class="muted">Foto capo</p><img id="labelPhoto" class="photo" alt="Foto etichetta"><p class="muted">Foto etichetta</p></div><div><p>CODICE MODELLO</p><h1 id="shownCode"></h1><p>ALLOCAZIONE</p><h2 id="shownLocation"></h2><p id="shownUpdated" class="muted"></p><button class="secondary" onclick="prepareEdit()">Modifica posizione</button><button class="danger" onclick="deleteProduct()">Elimina capo</button></div></div></section>
<section id="editPanel" class="panel"><h1 id="formTitle">Registra un capo</h1><label>Codice modello *</label><input id="code" placeholder="Codice esatto dell'etichetta"><div class="grid"><div><label>Zona *</label><input id="zone" placeholder="Es. Zona A"></div><div><label>Struttura *</label><select id="structure"><option>Scaffale</option><option>Barra appendiabiti</option><option>Altro</option></select></div></div><label>Ripiano o sezione *</label><input id="level" placeholder="Es. Ripiano 2 oppure Barra 4"><div class="grid"><div><label>Foto capo</label><input id="garmentFile" type="file" accept="image/*" capture="environment"></div><div><label>Foto etichetta</label><input id="labelFile" type="file" accept="image/*" capture="environment"></div></div><button id="saveButton" onclick="saveProduct()">Salva allocazione</button><button class="secondary" onclick="resetForm()">Pulisci</button><p id="message" class="muted"></p></section>
<section class="panel"><h1>Ultimi movimenti</h1><button class="secondary" onclick="loadHistory()">Aggiorna storico</button><div id="history"></div></section><button class="secondary" onclick="signOut()">Esci</button></section></main>
<script>
const SUPABASE_URL='https://bnqnuxnguidmfpjakraq.supabase.co';
const SUPABASE_KEY='sb_publishable_NCJHX0SrfSh5xcBiHkqA5g_OJioQNDj';
const db=window.supabase.createClient(SUPABASE_URL,SUPABASE_KEY);let currentProduct=null,busy=false;
const el=id=>document.getElementById(id),say=(id,t)=>el(id).textContent=t;const locationText=p=>[p.zona,p.struttura,p.livello].filter(Boolean).join(' · ');
async function refresh(){const {data:{session}}=await db.auth.getSession();el('login').style.display=session?'none':'block';el('app').style.display=session?'block':'none';if(session)loadHistory()}
async function signIn(){say('loginMessage','Accesso in corso…');const {error}=await db.auth.signInWithPassword({email:el('email').value.trim(),password:el('password').value});if(error){say('loginMessage','Accesso non riuscito: '+error.message);return}refresh()}
async function signOut(){await db.auth.signOut();currentProduct=null;refresh()}db.auth.onAuthStateChange(()=>setTimeout(refresh,0));
async function searchProduct(){const code=el('searchCode').value.trim();if(!code){say('searchMessage','Inserisci il codice modello.');return}say('searchMessage','Ricerca…');const {data,error}=await db.from('magazzino_prodotti').select('*').eq('codice_modello',code).maybeSingle();if(error){say('searchMessage','Errore: '+error.message);return}if(!data){currentProduct=null;el('productPanel').style.display='none';say('searchMessage','Nessun capo trovato.');return}currentProduct=data;el('productPanel').style.display='block';say('searchMessage','Capo trovato');say('shownCode',data.codice_modello);say('shownLocation',locationText(data));say('shownUpdated','Aggiornato: '+new Date(data.aggiornato_il).toLocaleString('it-IT'));await photo('garmentPhoto',data.foto_capo);await photo('labelPhoto',data.foto_etichetta)}
async function photo(id,path){el(id).removeAttribute('src');if(!path){el(id).alt='Nessuna foto';return}const {data,error}=await db.storage.from('magazzino-foto').createSignedUrl(path,3600);if(error){el(id).alt='Foto non disponibile';return}el(id).src=data.signedUrl}
function prepareEdit(){if(!currentProduct)return;say('formTitle','Modifica allocazione');el('code').value=currentProduct.codice_modello;el('code').disabled=true;el('zone').value=currentProduct.zona;el('structure').value=currentProduct.struttura;el('level').value=currentProduct.livello||'';el('saveButton').textContent='Salva modifiche';el('editPanel').scrollIntoView({behavior:'smooth'})}
function resetForm(){currentProduct=null;el('code').disabled=false;['code','zone','level'].forEach(id=>el(id).value='');el('structure').selectedIndex=0;el('garmentFile').value='';el('labelFile').value='';say('formTitle','Registra un capo');el('saveButton').textContent='Salva allocazione';say('message','')}
async function upload(file,code,kind){if(!file)return null;const safe=code.replace(/[^a-zA-Z0-9._-]/g,'_'),ext=(file.name.split('.').pop()||'jpg').replace(/[^a-z0-9]/gi,'');const path=safe+'/'+kind+'-'+Date.now()+'.'+(ext||'jpg');const {error}=await db.storage.from('magazzino-foto').upload(path,file,{contentType:file.type||'image/jpeg'});if(error)throw error;return path}
async function saveProduct(){if(busy)return;const code=el('code').value.trim(),zone=el('zone').value.trim(),structure=el('structure').value,level=el('level').value.trim();if(!code||!zone||!level){say('message','Compila codice, zona e ripiano/sezione.');return}busy=true;el('saveButton').disabled=true;say('message','Salvataggio…');try{const {data:{user}}=await db.auth.getUser();if(!user)throw Error('Accedi di nuovo.');const old=currentProduct,g=await upload(el('garmentFile').files[0],code,'capo'),l=await upload(el('labelFile').files[0],code,'etichetta'),v={codice_modello:code,zona,struttura,livello,aggiornato_il:new Date().toISOString()};if(g)v.foto_capo=g;else if(old)v.foto_capo=old.foto_capo;if(l)v.foto_etichetta=l;else if(old)v.foto_etichetta=old.foto_etichetta;let r;if(old)r=await db.from('magazzino_prodotti').update(v).eq('id',old.id).select().single();else{v.creato_da=user.id;r=await db.from('magazzino_prodotti').insert(v).select().single()}if(r.error)throw r.error;el('searchCode').value=code;await searchProduct();await loadHistory();resetForm();say('message','Allocazione salvata.')}catch(e){say('message','Errore: '+(e.message||e))}finally{busy=false;el('saveButton').disabled=false}}
async function deleteProduct(){if(!currentProduct||!confirm('Eliminare il capo? Lo storico resterà.'))return;const {error}=await db.from('magazzino_prodotti').delete().eq('id',currentProduct.id);if(error){alert('Errore: '+error.message);return}currentProduct=null;el('productPanel').style.display='none';say('searchMessage','Capo eliminato; storico aggiornato.');loadHistory()}
async function loadHistory(){const {data,error}=await db.from('magazzino_storico').select('*').order('eseguito_il',{ascending:false}).limit(20);if(error){say('history','Errore storico: '+error.message);return}const box=el('history');box.innerHTML='';if(!data?.length){box.textContent='Nessun movimento registrato.';return}data.forEach(x=>{const d=document.createElement('div');d.className='row';const from=[x.zona_precedente,x.struttura_precedente,x.livello_precedente].filter(Boolean).join(' · '),to=[x.zona_nuova,x.struttura_nuova,x.livello_nuovo].filter(Boolean).join(' · ');d.textContent=new Date(x.eseguito_il).toLocaleString('it-IT')+' — '+x.operazione+' — '+x.codice_modello+(from?' | Da: '+from:'')+(to?' | A: '+to:'');box.appendChild(d)})}
el('searchCode').addEventListener('keydown',e=>{if(e.key==='Enter')searchProduct()});refresh();
</script></body></html>
